services:
  - type: web
    name: nivaar
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: REQUIRE_LIVE_PROVIDERS
        value: true
      - key: REPORT_SIGNING_SECRET
        generateValue: true
      - key: BENCHMARK_TOKEN
        generateValue: true
      - key: SARVAM_STT_MODEL
        value: saaras:v3
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_SPEAKER
        value: shubh
      - key: RATE_LIMIT_PER_MINUTE
        value: 20
      - key: MAX_CONCURRENT_ANALYSES
        value: 4
